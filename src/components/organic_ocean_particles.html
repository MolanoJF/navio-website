<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGL Particle Ocean</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: #03002c;
            cursor: crosshair;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        
        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.5);
            font-family: 'Courier New', monospace;
            font-size: 12px;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            color: #fff;
            width: 280px;
            font-size: 13px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
        }
        
        .controls::-webkit-scrollbar {
            width: 6px;
        }
        
        .controls::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }
        
        .controls::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }
        
        .controls::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .controls h3 {
            margin: 0 0 20px 0;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }
        
        .control-section {
            margin-bottom: 30px;
        }
        
        .control-section h4 {
            margin: 0 0 15px 0;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.6);
        }
        
        .control-group {
            margin-bottom: 20px;
        }
        
        .control-group label {
            display: block;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .control-group input[type="range"] {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
            border-radius: 2px;
        }
        
        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            background: #fff;
            cursor: pointer;
            border-radius: 50%;
            transition: all 0.2s;
        }
        
        .control-group input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        
        .control-group input[type="range"]::-moz-range-thumb {
            width: 12px;
            height: 12px;
            background: #fff;
            cursor: pointer;
            border-radius: 50%;
            border: none;
            transition: all 0.2s;
        }
        
        .control-group input[type="range"]::-moz-range-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        
        .value-display {
            display: inline-block;
            float: right;
            color: #4a9eff;
            font-weight: bold;
        }
        
        .preset-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }
        
        .preset-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.8);
            padding: 8px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .preset-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }
        
        .ripple-counter {
            margin-top: 10px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 5px;
            font-size: 11px;
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="info">Click to create ripples</div>
    
    <div class="controls">
        <h3>Ocean Controls</h3>
        
        <div class="control-section">
            <h4>Wave Settings</h4>
            
            <div class="control-group">
                <label>
                    Wave Amplitude
                    <span class="value-display" id="amplitudeValue">8</span>
                </label>
                <input type="range" id="amplitude" min="0" max="20" value="8" step="0.5">
            </div>
            
            <div class="control-group">
                <label>
                    Wave Frequency
                    <span class="value-display" id="frequencyValue">1</span>
                </label>
                <input type="range" id="frequency" min="0.1" max="3" value="1" step="0.1">
            </div>
            
            <div class="control-group">
                <label>
                    Wave Speed
                    <span class="value-display" id="speedValue">0.5</span>
                </label>
                <input type="range" id="speed" min="0" max="2" value="0.5" step="0.1">
            </div>
        </div>
        
        <div class="control-section">
            <h4>Noise Settings</h4>
            
            <div class="control-group">
                <label>
                    Noise Intensity
                    <span class="value-display" id="noiseValue">0.5</span>
                </label>
                <input type="range" id="noise" min="0" max="2" value="0.5" step="0.1">
            </div>
            
            <div class="control-group">
                <label>
                    Noise Scale
                    <span class="value-display" id="noiseScaleValue">1</span>
                </label>
                <input type="range" id="noiseScale" min="0.1" max="3" value="1" step="0.1">
            </div>
            
            <div class="control-group">
                <label>
                    Turbulence
                    <span class="value-display" id="turbulenceValue">0.3</span>
                </label>
                <input type="range" id="turbulence" min="0" max="1" value="0.3" step="0.05">
            </div>
        </div>
        
        <div class="control-section">
            <h4>Ripple Effects</h4>
            
            <div class="control-group">
                <label>
                    Ripple Strength
                    <span class="value-display" id="rippleStrengthValue">15</span>
                </label>
                <input type="range" id="rippleStrength" min="0" max="30" value="15" step="1">
            </div>
            
            <div class="control-group">
                <label>
                    Ripple Speed
                    <span class="value-display" id="rippleSpeedValue">0.3</span>
                </label>
                <input type="range" id="rippleSpeed" min="0.1" max="1" value="0.3" step="0.05">
            </div>
            
            <div class="control-group">
                <label>
                    Max Ripple Radius
                    <span class="value-display" id="rippleRadiusValue">50</span>
                </label>
                <input type="range" id="rippleRadius" min="10" max="100" value="50" step="5">
            </div>
            
            <div class="control-group">
                <label>
                    Max Simultaneous Ripples
                    <span class="value-display" id="maxRipplesValue">5</span>
                </label>
                <input type="range" id="maxRipples" min="1" max="10" value="5" step="1">
            </div>
            
            <div class="ripple-counter">
                Active Ripples: <span id="activeRipples">0</span>
            </div>
        </div>
        
        <div class="preset-buttons">
            <button class="preset-btn" onclick="setPreset('calm')">Calm Sea</button>
            <button class="preset-btn" onclick="setPreset('stormy')">Stormy</button>
            <button class="preset-btn" onclick="setPreset('organic')">Organic</button>
            <button class="preset-btn" onclick="setPreset('digital')">Digital</button>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Optimized performance settings
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const particleCount = isMobile ? 3600 : 8100; // Optimized particle counts (60x60, 90x90)
        const gridSize = Math.sqrt(particleCount);
        
        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 300);
        const renderer = new THREE.WebGLRenderer({ 
            canvas: document.getElementById('canvas'),
            antialias: false,
            alpha: false,
            powerPreference: "high-performance",
            precision: "mediump" // Lower precision for better performance
        });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); // Further capped for performance
        
        // Optimized parameters
        const spacing = isMobile ? 2.0 : 1.5;
        
        // Wave parameters
        let waveParams = {
            amplitude: 2,
            frequency: 2.5,
            speed: 1.5,
            noiseIntensity: 0.3,
            noiseScale: 1,
            turbulence: 0.05
        };
        
        // Ripple parameters
        let rippleParams = {
            strength: 8,
            speed: 0.6,
            maxRadius: 90,
            maxRipples: 3
        };
        
        // Create geometry
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const ripples = [];
        
        // Pre-calculate grid positions
        const gridPositions = [];
        for (let i = 0; i < gridSize; i++) {
            for (let j = 0; j < gridSize; j++) {
                gridPositions.push({
                    x: (i - gridSize / 2) * spacing,
                    z: (j - gridSize / 2) * spacing
                });
            }
        }
        
        // Initialize particles
        for (let i = 0; i < particleCount; i++) {
            const pos = gridPositions[i];
            positions[i * 3] = pos.x;
            positions[i * 3 + 1] = 0;
            positions[i * 3 + 2] = pos.z;
        }
        
        // Random factors for turbulence
        const randomFactors = new Float32Array(particleCount);
        for (let i = 0; i < particleCount; i++) {
            randomFactors[i] = Math.random() * 2 - 1;
        }
        
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        
        // Simplified fast noise (removed cache for memory efficiency)
        function fastNoise(x, y, scale) {
            const value = Math.sin(x * scale * 12.9898 + y * scale * 78.233) * 43758.5453;
            return (value - Math.floor(value)) * 2 - 1;
        }
        
        // Optimized shader
        const vertexShader = `
            varying float vIntensity;
            
            void main() {
                vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                vIntensity = 0.5 + (position.y * 0.05);
                gl_PointSize = 2.5 * (150.0 / -mvPosition.z);
                gl_Position = projectionMatrix * mvPosition;
            }
        `;
        
        const fragmentShader = `
            varying float vIntensity;
            
            void main() {
                vec2 center = gl_PointCoord - 0.5;
                float dist = length(center);
                
                if (dist > 0.5) discard;
                
                float alpha = 1.0 - smoothstep(0.0, 0.5, dist);
                gl_FragColor = vec4(0.9 * vIntensity, 0.95 * vIntensity, vIntensity, alpha * 0.7);
            }
        `;
        
        const material = new THREE.ShaderMaterial({
            vertexShader,
            fragmentShader,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            depthTest: false
        });
        
        const particles = new THREE.Points(geometry, material);
        scene.add(particles);
        
        // Optimized camera position
        camera.position.set(0, 10, 78);
        camera.lookAt(0, 0, 20);
        
        // Optimized raycaster
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        
        // Throttled mouse click
        let lastClickTime = 0;
        function onMouseClick(event) {
            const now = performance.now();
            if (now - lastClickTime < 150) return;
            lastClickTime = now;
            
            if (event.target.closest('.controls')) return;
            
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            
            const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
            const intersectPoint = new THREE.Vector3();
            raycaster.ray.intersectPlane(plane, intersectPoint);
            
            if (ripples.length >= rippleParams.maxRipples) {
                ripples.shift();
            }
            
            ripples.push({
                center: intersectPoint,
                radius: 0,
                strength: rippleParams.strength,
                speed: rippleParams.speed
            });
            
            updateRippleCounter();
        }
        
        window.addEventListener('click', onMouseClick, { passive: true });
        
        // Debounced resize
        let resizeTimeout;
        function onWindowResize() {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }, 250);
        }
        
        window.addEventListener('resize', onWindowResize, { passive: true });
        
        // Update ripple counter
        function updateRippleCounter() {
            document.getElementById('activeRipples').textContent = ripples.length;
        }
        
        // Optimized control handlers
        const updateParam = (param, value, displayId) => {
            waveParams[param] = parseFloat(value);
            document.getElementById(displayId).textContent = value;
        };
        
        const updateRippleParam = (param, value, displayId) => {
            rippleParams[param] = parseFloat(value);
            document.getElementById(displayId).textContent = value;
        };
        
        // Event listeners with passive option
        document.getElementById('amplitude').addEventListener('input', (e) => 
            updateParam('amplitude', e.target.value, 'amplitudeValue'), { passive: true });
        
        document.getElementById('frequency').addEventListener('input', (e) => 
            updateParam('frequency', e.target.value, 'frequencyValue'), { passive: true });
        
        document.getElementById('speed').addEventListener('input', (e) => 
            updateParam('speed', e.target.value, 'speedValue'), { passive: true });
        
        document.getElementById('noise').addEventListener('input', (e) => 
            updateParam('noiseIntensity', e.target.value, 'noiseValue'), { passive: true });
        
        document.getElementById('noiseScale').addEventListener('input', (e) => 
            updateParam('noiseScale', e.target.value, 'noiseScaleValue'), { passive: true });
        
        document.getElementById('turbulence').addEventListener('input', (e) => 
            updateParam('turbulence', e.target.value, 'turbulenceValue'), { passive: true });
        
        document.getElementById('rippleStrength').addEventListener('input', (e) => 
            updateRippleParam('strength', e.target.value, 'rippleStrengthValue'), { passive: true });
        
        document.getElementById('rippleSpeed').addEventListener('input', (e) => 
            updateRippleParam('speed', e.target.value, 'rippleSpeedValue'), { passive: true });
        
        document.getElementById('rippleRadius').addEventListener('input', (e) => {
            rippleParams.maxRadius = parseFloat(e.target.value);
            document.getElementById('rippleRadiusValue').textContent = e.target.value;
        }, { passive: true });
        
        document.getElementById('maxRipples').addEventListener('input', (e) => {
            rippleParams.maxRipples = parseInt(e.target.value);
            document.getElementById('maxRipplesValue').textContent = e.target.value;
        }, { passive: true });
        
        // Simplified presets
        function setPreset(preset) {
            const presets = {
                calm: {
                    amplitude: 3, frequency: 0.5, speed: 0.3, noiseIntensity: 0.2, noiseScale: 0.5, turbulence: 0.1,
                    rippleStrength: 8, rippleSpeed: 0.2, maxRadius: 30, maxRipples: 3
                },
                stormy: {
                    amplitude: 15, frequency: 2, speed: 1.5, noiseIntensity: 1.5, noiseScale: 2, turbulence: 0.8,
                    rippleStrength: 25, rippleSpeed: 0.6, maxRadius: 70, maxRipples: 8
                },
                organic: {
                    amplitude: 8, frequency: 1.2, speed: 0.6, noiseIntensity: 1, noiseScale: 1.5, turbulence: 0.5,
                    rippleStrength: 15, rippleSpeed: 0.3, maxRadius: 50, maxRipples: 5
                },
                digital: {
                    amplitude: 10, frequency: 1.8, speed: 0.8, noiseIntensity: 0.3, noiseScale: 0.8, turbulence: 0.2,
                    rippleStrength: 20, rippleSpeed: 0.4, maxRadius: 60, maxRipples: 6
                }
            };
            
            const config = presets[preset];
            if (config) {
                Object.assign(waveParams, config);
                Object.assign(rippleParams, config);
                
                // Update UI elements efficiently
                const controls = [
                    ['amplitude', 'amplitudeValue'],
                    ['frequency', 'frequencyValue'],
                    ['speed', 'speedValue'],
                    ['noise', 'noiseValue'],
                    ['noiseScale', 'noiseScaleValue'],
                    ['turbulence', 'turbulenceValue']
                ];
                
                controls.forEach(([id, valueId]) => {
                    const param = id === 'noise' ? 'noiseIntensity' : id;
                    document.getElementById(id).value = config[param];
                    document.getElementById(valueId).textContent = config[param];
                });
                
                document.getElementById('rippleStrength').value = config.rippleStrength;
                document.getElementById('rippleStrengthValue').textContent = config.rippleStrength;
                document.getElementById('rippleSpeed').value = config.rippleSpeed;
                document.getElementById('rippleSpeedValue').textContent = config.rippleSpeed;
                document.getElementById('rippleRadius').value = config.maxRadius;
                document.getElementById('rippleRadiusValue').textContent = config.maxRadius;
                document.getElementById('maxRipples').value = config.maxRipples;
                document.getElementById('maxRipplesValue').textContent = config.maxRipples;
            }
        }
        
        // Highly optimized animation loop
        let time = 0;
        let frameCount = 0;
        const skipFrames = isMobile ? 3 : 1; // More aggressive frame skipping on mobile
        
        // Pre-compute constants
        const freq1 = 0.08;
        const freq2 = 0.05;
        const freq3 = 0.025;
        
        function animate() {
            requestAnimationFrame(animate);
            
            frameCount++;
            if (frameCount % skipFrames !== 0) return;
            
            time += 0.016; // ~60fps time step
            
            const positions = geometry.attributes.position.array;
            const { amplitude, frequency, speed, noiseIntensity, noiseScale, turbulence } = waveParams;
            
            // Pre-calculate time-based values
            const timeSpeed = time * speed;
            const slowTime = time * 0.05; // Reduced for efficiency
            
            // Simplified organic factors
            const organicOffset = Math.sin(slowTime) * 0.3;
            
            // Efficient batch processing
            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                const x = positions[i3];
                const z = positions[i3 + 2];
                
                // Streamlined organic diagonal waves (only 3 main waves)
                let y = 0;
                
                // Primary diagonal wave
                y += Math.sin((x + z + organicOffset) * freq1 * frequency + timeSpeed) * amplitude;
                
                // Secondary cross-diagonal 
                y += Math.sin((x - z * 0.7) * freq2 * frequency + timeSpeed * 0.8) * amplitude * 0.5;
                
                // Large swell
                y += Math.sin((x + z) * freq3 * frequency + timeSpeed * 0.3) * amplitude * 0.8;
                
                // Simplified noise (only if significant)
                if (noiseIntensity > 0.1) {
                    y += fastNoise(x, z, noiseScale) * noiseIntensity * amplitude * 0.5;
                }
                
                // Turbulence (optimized)
                if (turbulence > 0.01) {
                    const randFactor = randomFactors[i];
                    y += Math.sin(timeSpeed * 10 + randFactor * 10) * turbulence * amplitude;
                }
                
                // Optimized ripple effects
                for (let r = 0; r < ripples.length; r++) {
                    const ripple = ripples[r];
                    const dx = x - ripple.center.x;
                    const dz = z - ripple.center.z;
                    const distSq = dx * dx + dz * dz;
                    const radiusSq = ripple.radius * ripple.radius;
                    
                    if (distSq < radiusSq) {
                        const distance = Math.sqrt(distSq);
                        const rippleHeight = Math.sin((distance - ripple.radius) * 0.5) * 
                                            ripple.strength * 
                                            Math.exp(-ripple.radius * 0.05);
                        y += rippleHeight;
                    }
                }
                
                positions[i3 + 1] = y;
            }
            
            // Update ripples efficiently
            for (let i = ripples.length - 1; i >= 0; i--) {
                ripples[i].radius += ripples[i].speed;
                
                if (ripples[i].radius > rippleParams.maxRadius) {
                    ripples.splice(i, 1);
                    updateRippleCounter();
                }
            }
            
            geometry.attributes.position.needsUpdate = true;
            
            // Reduced camera movement frequency
            if (frameCount % 10 === 0) {
                camera.position.x = Math.sin(time * 0.05) * 1.5;
                camera.position.y = 10 + Math.sin(time * 0.1) * 0.5;
                camera.lookAt(0, 0, 20);
            }
            
            renderer.render(scene, camera);
        }
        
        animate();
    </script>
</body>
</html>
